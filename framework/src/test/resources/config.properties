# ===========================================
# Test Automation Framework - Configuration
# ===========================================

# Browser settings
browser=chrome
headless=true

# URLs
base.url=https://the-internet.herokuapp.com
api.base.url=https://httpbin.org

# Timeouts (seconds)
explicit.wait=15
fluent.wait=30
polling.time=500
page.load.timeout=30

# API timeouts
api.timeout=10
api.sla.ms=5000

# Retry
retry.count=2

# Parallel execution
parallel.count=3

# Screenshots
screenshot.on.failure=true