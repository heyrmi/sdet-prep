# ===========================================
# Test Automation Framework - Configuration
# ===========================================

# Browser settings
browser=chrome
headless=true

# URLs
base.url=https://the-internet.herokuapp.com
api.base.url=https://httpbin.org

# Timeouts (seconds)
implicit.wait=10
explicit.wait=15
page.load.timeout=30
fluent.wait=20
fluent.polling=500

# Retry
retry.count=2

# Parallel execution
parallel.count=3
