<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessibility Sample</title>
    <style>
        body { font-family: Arial, sans-serif; }
        /* Deliberately low-contrast text: light grey on white -> WCAG colour-contrast violation. */
        .low-contrast { color: #bfbfbf; background: #ffffff; }
        .clean { color: #000000; background: #ffffff; }
    </style>
</head>
<body>
    <!-- Region WITH known violations -->
    <div id="broken">
        <h1>Accessibility Demo</h1>

        <!-- Violation: <img> without alt attribute (rule: image-alt) -->
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" width="120" height="60">

        <!-- Violation: input without an associated label (rule: label) -->
        <input type="text" name="email">

        <!-- Violation: low contrast text (rule: color-contrast) -->
        <p class="low-contrast">This grey text on a white background fails contrast requirements.</p>
    </div>

    <!-- Region that is CLEAN and should pass -->
    <div id="clean">
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" name="fullname">
        <p class="clean">This black text on white passes contrast requirements.</p>
    </div>
</body>
</html>
