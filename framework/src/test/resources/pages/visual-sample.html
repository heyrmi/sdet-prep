<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visual Regression Sample</title>
    <style>
        /* Fixed, deterministic layout: no animations, no dates, no web fonts, no images.
           Everything is sized in absolute px so renders are byte-stable across runs. */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 1000px; height: 600px; background: #ffffff;
                     font-family: Arial, Helvetica, sans-serif; }
        #app { width: 1000px; height: 600px; position: relative; overflow: hidden; }
        #header { position: absolute; top: 0; left: 0; width: 1000px; height: 90px;
                  background: #1f2933; color: #ffffff; }
        #header h1 { position: absolute; top: 28px; left: 40px; font-size: 28px; font-weight: bold; }
        #card { position: absolute; top: 140px; left: 40px; width: 400px; height: 320px;
                background: #e4f0fb; border: 4px solid #2b6cb0; }
        #card .title { position: absolute; top: 24px; left: 24px; font-size: 22px; color: #1a365d; }
        #card .swatch-a { position: absolute; top: 80px; left: 24px; width: 120px; height: 120px; background: #e53e3e; }
        #card .swatch-b { position: absolute; top: 80px; left: 160px; width: 120px; height: 120px; background: #38a169; }
        #panel { position: absolute; top: 140px; left: 520px; width: 440px; height: 320px;
                 background: #fffaf0; border: 4px solid #dd6b20; }
        #panel .box { position: absolute; width: 80px; height: 80px; background: #4a5568; }
        #panel .b1 { top: 40px; left: 40px; }
        #panel .b2 { top: 40px; left: 160px; }
        #panel .b3 { top: 40px; left: 280px; }
        #footer { position: absolute; top: 520px; left: 0; width: 1000px; height: 80px;
                  background: #edf2f7; }
        #footer .bar { position: absolute; top: 30px; left: 40px; width: 920px; height: 20px; background: #a0aec0; }
    </style>
</head>
<body>
    <div id="app">
        <div id="header"><h1>Deterministic Visual Baseline</h1></div>
        <div id="card">
            <div class="title">Card Component</div>
            <div class="swatch-a"></div>
            <div class="swatch-b"></div>
        </div>
        <div id="panel">
            <div class="box b1"></div>
            <div class="box b2"></div>
            <div class="box b3"></div>
        </div>
        <div id="footer"><div class="bar"></div></div>
    </div>
</body>
</html>
