name: Run Framework Tests

on:
  workflow_dispatch:
    inputs:
      test-type:
        description: 'Which tests to run'
        required: true
        type: choice
        options:
          - api
          - ui
          - all

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Install Chrome (UI tests)
        if: inputs.test-type == 'ui' || inputs.test-type == 'all'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Run API tests
        if: inputs.test-type == 'api'
        run: mvn test -pl framework -Dtest=HttpBinApiTest -Dsurefire.useFile=false

      - name: Run UI tests
        if: inputs.test-type == 'ui'
        run: mvn test -pl framework -Dtest="LoginTest,CheckboxTest,DropdownTest" -Dheadless=true -Dsurefire.useFile=false

      - name: Run all tests
        if: inputs.test-type == 'all'
        run: mvn test -pl framework -Dheadless=true -Dsurefire.useFile=false

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ inputs.test-type }}
          path: framework/target/extent-report.html
          retention-days: 7

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ inputs.test-type }}
          path: framework/target/surefire-reports/
          retention-days: 7
