name: Run Framework Tests

on:
  workflow_dispatch:
    inputs:
      test-type:
        description: 'Which tests to run'
        required: true
        type: choice
        options:
          - api
          - web
          - smoke
          - all

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Install Chrome (web tests)
        if: inputs.test-type == 'web' || inputs.test-type == 'smoke' || inputs.test-type == 'all'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Run API tests
        if: inputs.test-type == 'api'
        run: mvn -f framework/pom.xml test -Papi -Dsurefire.useFile=false

      - name: Run Web tests
        if: inputs.test-type == 'web'
        run: mvn -f framework/pom.xml test -Pweb -Dheadless=true -Dsurefire.useFile=false

      - name: Run Smoke tests
        if: inputs.test-type == 'smoke'
        run: mvn -f framework/pom.xml test -Psmoke -Dheadless=true -Dsurefire.useFile=false

      - name: Run all tests
        if: inputs.test-type == 'all'
        run: mvn -f framework/pom.xml test -Dheadless=true -Dsurefire.useFile=false

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ inputs.test-type }}
          path: framework/target/allure-results/
          retention-days: 7

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ inputs.test-type }}
          path: framework/target/surefire-reports/
          retention-days: 7
