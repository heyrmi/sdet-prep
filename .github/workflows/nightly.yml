name: Nightly (networked)

# Everything that talks to a live service or a real browser. Split out from ci.yml so third-party
# flakiness never blocks a merge — but still runs often enough that rot gets caught within a day.
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:

jobs:
  networked-problems:
    name: Networked DSA/SDET problems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Build reactor
        run: mvn -B clean install -DskipTests

      - name: Run all problems including networked ones
        run: mvn -B -pl verifier test -Dverifier.offline=false -Dverifier.timeoutSeconds=120

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-verifier-reports
          path: verifier/target/surefire-reports/
          retention-days: 14

  playwright-suites:
    name: Playwright UI + API suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json

      - name: Install
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run suites
        working-directory: playwright
        run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 14
